name: Auto Build

on:
  workflow_dispatch:
  # 推送时触发；是否真正执行构建由 check_commit 判定（手动运行 force_build）
  push:
permissions: write-all
env:
  TAG_NAME: autobuild
  TAG_CHANNEL: AutoBuild
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
concurrency:
  group: "${{ github.workflow }} - ${{ github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check_commit:
    name: Check Commit Needs Build
    uses: clash-verge-rev/clash-verge-rev/.github/workflows/check-commit-needs-build.yml@dev
    with:
      tag_name: autobuild
      force_build: ${{ github.event_name == 'workflow_dispatch' }}

  update_tag:
    name: Update tag
    runs-on: ubuntu-latest
    needs: check_commit
    if: ${{ needs.check_commit.outputs.should_run == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/extract_update_logs.sh
        shell: bash

      - uses: pnpm/action-setup@v4.2.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release AutoBuild Version
        run: pnpm release-version autobuild-latest

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/clash-verge-rev/clash-verge-rev/releases/download/autobuild" >> $GITHUB_ENV
        shell: bash

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Clash Verge Rev ${{ env.TAG_CHANNEL }}"
          body: ""
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false

  clean_old_assets:
    name: Clean Old Release Assets
    needs: [check_commit, update_tag]
    if: ${{ needs.check_commit.outputs.should_run == 'true' && needs.update_tag.result == 'success' }}

    uses: clash-verge-rev/clash-verge-rev/.github/workflows/clean-old-assets.yml@dev
    with:
      tag_name: autobuild
      dry_run: false

  # 自用构建：不签名、不公证。Windows + macOS（Apple Silicon / Intel）
  autobuild-windows-macos:
    name: Autobuild Windows / macOS
    needs: [check_commit, update_tag]
    if: ${{ needs.check_commit.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          prefix-key: "v1-rust"
          key: "rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}"
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - uses: pnpm/action-setup@v4.2.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: "pnpm"

      - name: Pnpm Cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ matrix.os }}-${{ matrix.target }}"
          restore-keys: |
            pnpm-shared-stable-${{ matrix.os }}-${{ matrix.target }}

      - name: Pnpm install and check
        env:
          # Cross-repo private release access requires a PAT/fine-grained token.
          # Prefer MIHOMO_REPO_TOKEN; fallback to the default repository GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.MIHOMO_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.MIHOMO_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }} --force

      - name: Release ${{ env.TAG_CHANNEL }} Version
        run: pnpm release-version autobuild-latest

      - name: Add Rust Target
        run: |
          # Ensure cross target is installed for the pinned toolchain; fallback without explicit toolchain if needed
          rustup target add ${{ matrix.target }} --toolchain 1.91.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed
          echo "Rust target ${{ matrix.target }} installed."

      - name: Configure updater for autobuild (check autobuild channel, no signing)
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          config.bundle.createUpdaterArtifacts = false;
          const repo = process.env.GITHUB_REPOSITORY || 'clash-verge-rev/clash-verge-rev';
          const base = 'https://github.com/' + repo + '/releases/download/autobuild';
          config.plugins.updater = {
            pubkey: '',
            endpoints: [
              'https://download.clashverge.dev/' + base + '/update-proxy.json',
              base + '/update-proxy.json',
              base + '/update.json'
            ],
            windows: { installMode: 'basicUi' }
          };
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(config, null, 2));
          "
          echo "Autobuild will check updates from autobuild release (unsigned)"

      - name: Tauri build for ${{ matrix.target }}
        uses: tauri-apps/tauri-action@v0
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自用构建：不配置签名密钥 / Apple 证书
          # No TAURI_SIGNING_PRIVATE_KEY = no updater signing
          # No APPLE_CERTIFICATE = no macOS code signing
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: "Clash Verge Rev ${{ env.TAG_CHANNEL }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: true
          tauriScript: pnpm
          args: --target ${{ matrix.target }}
          # includeUpdaterJson: true

      # 多矩阵并行时只上传一份 version，避免 artifact 重名冲突
      - name: Save version for update-json job
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          node -p "require('./package.json').version" > version.txt
          cat version.txt

      - name: Upload version artifact
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: autobuild-version
          path: version.txt

  upload-autobuild-update-json:
    name: Upload autobuild update.json
    needs: autobuild-windows-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download version
        uses: actions/download-artifact@v4
        with:
          name: autobuild-version

      - name: Run autobuild-update-json script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(cat version.txt | tr -d '\n\r')
          export AUTOBUILD_VERSION="$VERSION"
          node scripts/autobuild-update-json.mjs
